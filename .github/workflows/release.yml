name: Release

# Push a tag such as v2.0.0 to build the Windows package and publish it as a GitHub release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Select-String -Path app/meta.py -Pattern 'VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $version in app/meta.py" }
      - name: Build package
        shell: pwsh
        run: ./build_package.ps1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LabelPrintStudio-*-win64.zip
          generate_release_notes: true
